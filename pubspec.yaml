name: suelto_mobprog
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  # important !
  flutter_screenutil: ^5.9.3
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# important !
flutter:
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: Klavika
      fonts:
      - asset: assets/fonts/Klavika-Regular.ttf
    - family: Klavika-Bold
      fonts:
      - asset: assets/fonts/Klavika-Bold.ttf
  uses-material-design: true
  